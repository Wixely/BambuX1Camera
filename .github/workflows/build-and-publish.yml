name: Build and publish packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04

    steps:
      - name: Check out the tested revision
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $authorization = [Convert]::ToBase64String(
              [Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GITHUB_TOKEN"))

          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" `
              fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git checkout --detach --force FETCH_HEAD

      - name: Authenticate package restore
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet nuget update source github-wixely `
              --username $env:GITHUB_REPOSITORY_OWNER `
              --password $env:GITHUB_TOKEN `
              --store-password-in-clear-text `
              --configfile NuGet.config

      - name: Build and run protocol specifications
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet --info
          dotnet restore BambuX1Camera.slnx
          dotnet build BambuX1Camera.slnx --configuration Release --no-restore
          dotnet run `
              --project tests/BambuLab.X1Camera.Specs/BambuLab.X1Camera.Specs.csproj `
              --configuration Release `
              --no-build

  publish:
    name: Pack, validate, and publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the tagged revision
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $authorization = [Convert]::ToBase64String(
              [Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GITHUB_TOKEN"))

          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $authorization" `
              fetch --no-tags --depth=1 origin $env:GITHUB_SHA
          git checkout --detach --force FETCH_HEAD

      - name: Authenticate package restore
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet nuget update source github-wixely `
              --username $env:GITHUB_REPOSITORY_OWNER `
              --password $env:GITHUB_TOKEN `
              --store-password-in-clear-text `
              --configfile NuGet.config

      - name: Pack tagged packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $projects = @(
              "src/BambuLab.X1Camera/BambuLab.X1Camera.csproj",
              "src/BambuLab.X1Camera.Imaging/BambuLab.X1Camera.Imaging.csproj")

          foreach ($projectPath in $projects) {
              [xml]$project = Get-Content -Raw $projectPath
              $projectVersion = [string]$project.Project.PropertyGroup.Version
              if ($projectVersion -ne $tagVersion) {
                  throw "Tag version $tagVersion does not match $projectPath version $projectVersion."
              }
          }

          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/packages"
          dotnet restore BambuX1Camera.slnx
          foreach ($projectPath in $projects) {
              dotnet pack $projectPath `
                  --configuration Release `
                  --no-restore `
                  --output $packageDirectory `
                  -p:PackageVersion=$tagVersion `
                  -p:IncludeSymbols=true `
                  -p:SymbolPackageFormat=snupkg
          }

      - name: Validate packages in a clean consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/packages"
          $consumerDirectory = Join-Path $env:RUNNER_TEMP "package-consumer"

          dotnet nuget add source $packageDirectory `
              --name release-candidate `
              --configfile NuGet.config
          dotnet new console `
              --name PackageConsumer `
              --framework net10.0 `
              --no-restore `
              --output $consumerDirectory
          dotnet add "$consumerDirectory/PackageConsumer.csproj" package `
              BambuLab.X1Camera.Imaging `
              --version $tagVersion `
              --no-restore
          dotnet restore "$consumerDirectory/PackageConsumer.csproj" `
              --configfile NuGet.config
          dotnet build "$consumerDirectory/PackageConsumer.csproj" `
              --configuration Release `
              --no-restore

      - name: Publish packages to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/packages"
          $packages = @(Get-ChildItem $packageDirectory -Filter "*.nupkg" |
              Where-Object { -not $_.Name.EndsWith(".snupkg") })
          if ($packages.Count -ne 2) {
              throw "Expected two NuGet packages, found $($packages.Count)."
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName `
                  --source "https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER/index.json" `
                  --api-key $env:GITHUB_TOKEN `
                  --skip-duplicate
          }

      - name: Prepare standalone desktop release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/Prepare-DesktopRelease.ps1 -Version $tagVersion

      - name: Create GitHub prerelease and upload desktop assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tagName = $env:GITHUB_REF_NAME
          $tagVersion = $tagName.Substring(1)
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GITHUB_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
              "User-Agent" = "BambuX1Camera-release-workflow"
          }
          $releaseBody = @'
          This prerelease publishes the reusable `BambuLab.X1Camera` and
          `BambuLab.X1Camera.Imaging` NuGet packages plus the Avalonia sample application.

          The desktop downloads are self-contained, standalone single-file executables:

          - Windows x64: download the `.exe` and run it directly.
          - Linux x64: download the extensionless binary, run `chmod +x` on it, then launch it from a graphical X11 or XWayland desktop.

          Avalonia is used only by the sample application and is not a dependency of either NuGet package. Required project and native-renderer notices are provided in the separate notices archive. Verify downloads with `SHA256SUMS.txt`.
          '@
          $releasePayload = @{
              tag_name = $tagName
              target_commitish = $env:GITHUB_SHA
              name = $tagName
              body = $releaseBody
              draft = $false
              prerelease = $true
              generate_release_notes = $true
              make_latest = "false"
          } | ConvertTo-Json

          $encodedTag = [Uri]::EscapeDataString($tagName)
          try {
              $release = Invoke-RestMethod `
                  -Method Get `
                  -Uri "$apiRoot/releases/tags/$encodedTag" `
                  -Headers $headers
          }
          catch {
              $statusCode = [int]$_.Exception.Response.StatusCode
              if ($statusCode -ne 404) {
                  throw
              }

              $release = Invoke-RestMethod `
                  -Method Post `
                  -Uri "$apiRoot/releases" `
                  -Headers $headers `
                  -ContentType "application/json" `
                  -Body $releasePayload
          }

          $assetDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/$tagVersion"
          $assets = @(Get-ChildItem -LiteralPath $assetDirectory -File | Sort-Object Name)
          if ($assets.Count -ne 4) {
              throw "Expected four release assets, found $($assets.Count)."
          }

          $uploadRoot = $release.upload_url -replace '\{\?name,label\}$', ''
          foreach ($asset in $assets) {
              $existingAsset = @($release.assets | Where-Object { $_.name -eq $asset.Name }) |
                  Select-Object -First 1
              if ($existingAsset) {
                  Invoke-RestMethod `
                      -Method Delete `
                      -Uri "$apiRoot/releases/assets/$($existingAsset.id)" `
                      -Headers $headers | Out-Null
              }

              $contentType = switch ($asset.Extension) {
                  ".zip" { "application/zip" }
                  ".txt" { "text/plain" }
                  default { "application/octet-stream" }
              }
              $assetName = [Uri]::EscapeDataString($asset.Name)
              Invoke-RestMethod `
                  -Method Post `
                  -Uri "${uploadRoot}?name=$assetName" `
                  -Headers $headers `
                  -ContentType $contentType `
                  -InFile $asset.FullName | Out-Null
